; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
include_dir = .

[env:os3x_esp8266]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
extra_scripts = pre:run_prebuild.py
lib_ldf_mode = deep
lib_deps =
	https://github.com/ThingPulse/esp8266-oled-ssd1306/archive/4.2.0.zip
	knolleary/PubSubClient @ ^2.8
	symlink://external/OpenThings-Framework-Firmware-Library
	;https://github.com/OpenThingsIO/OpenThings-Framework-Firmware-Library @ ^0.2.0
; ignore html2raw.cpp source file for firmware compilation (external helper program)
build_src_filter = +<*> +<api/*> +<boards/*> +<core/*> +<drivers/*> +<platform/*> +<sensors/*> +<services/*> +<storage/*> +<util/*> -<html/*> -<tests/*> --<external/*>
upload_speed = 460800
monitor_speed = 115200
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.4m2m.ld
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
;build_flags = -DENABLE_DEBUG

[env:esp32_sprinkler]
platform = espressif32
board = bpi-bit
framework = arduino
lib_ldf_mode = deep
lib_deps = 
	; sui77/rc-switch @ ^2.6.3
	https://github.com/ThingPulse/esp8266-oled-ssd1306/archive/4.2.0.zip
	knolleary/PubSubClient @ ^2.8
	https://github.com/OpenThingsIO/OpenThings-Framework-Firmware-Library
	; https://github.com/OpenSprinklerShop/OpenThings-Framework-Firmware-Library
	;https://github.com/V1pr/OpenThings-Framework-Firmware-Library/archive/refs/heads/master.zip
	;https://github.com/Links2004/arduinoWebSockets/archive/refs/tags/2.4.0.zip
;	tobozo/ESP32-ENC28J60@^1.0.1
build_src_filter = +<*> -<html/*> --<external/*>
;upload_speed = 460800
monitor_speed = 115200
;board_build.flash_mode = qio
; Partition table + flash size: set ESP32_FLASH_4MB|8MB|32MB in esp32.h (default 4MB)
extra_scripts =
    pre:esp32_partition_setup.py
    merge_firmware.py
;build_flags = -DCORE_DEBUG_LEVEL=5
build_flags = -DARP_TABLE_SIZE=40
;board_build.f_flash = 80000000L
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L


; OpenSprinkler v4.0 uses an ESP32-C6 and Arduino-ESP32 Core 3. The platform
; release is pinned so firmware builds do not change with upstream updates.
[env:os4_esp32c6_n8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
extra_scripts = pre:run_prebuild.py
lib_ldf_mode = deep
lib_deps =
	https://github.com/ThingPulse/esp8266-oled-ssd1306/archive/4.2.0.zip
	knolleary/PubSubClient @ ^2.8
	symlink://external/OpenThings-Framework-Firmware-Library
build_src_filter = +<*> +<api/*> +<boards/*> +<core/*> +<drivers/*> +<platform/*> +<sensors/*> +<services/*> +<storage/*> +<util/*> -<html/*> -<tests/*> --<external/*>
board_build.partitions = os4_n8.csv
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
upload_speed = 460800
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DOS4_FLASH_N8=1

; The following env is for syntax highlighting only,
; it is NOT for building the firmware for Linux.
; To build the firmware for Linux, please follow:
; https://openthings.freshdesk.com/support/solutions/articles/5000631599
[env:linux]
platform = native
build_flags =
	${env.build_flags}
	-DOSPI

; The following env is for syntax highlighting only,
; it is NOT for building the firmware for Linux.
; To build the firmware for Linux, please follow:
; https://openthings.freshdesk.com/support/solutions/articles/5000631599
[env:demo]
platform = native
build_flags =
	${env.build_flags}
	-DDEMO
